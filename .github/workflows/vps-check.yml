name: AURELIS VPS connection check

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/vps-check.yml'

permissions:
  contents: read

jobs:
  connection-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify required secrets exist
        env:
          HOST: ${{ secrets.VPS_HOST }}
          KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          test -n "$HOST" || { echo 'VPS_HOST secret missing'; exit 1; }
          test -n "$KEY" || { echo 'VPS_SSH_KEY secret missing'; exit 1; }
          test -n "$KNOWN" || { echo 'VPS_KNOWN_HOSTS secret missing'; exit 1; }
      - name: Connect and inspect (read only)
        env:
          HOST: ${{ secrets.VPS_HOST }}
          KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          umask 077
          mkdir -p "$HOME/.ssh"
          # Accept either multiline OpenSSH keys or keys containing literal backslash-n.
          python3 -c 'import os,pathlib; pathlib.Path.home().joinpath(".ssh/aurelis_deploy").write_text(os.environ["KEY"].replace(chr(92)+"n",chr(10)).rstrip()+chr(10))'
          unset KEY
          if ! ssh-keygen -y -P '' -f "$HOME/.ssh/aurelis_deploy" > /dev/null 2>&1; then
            echo 'Invalid VPS_SSH_KEY: paste the complete, unencrypted OpenSSH private key into the GitHub secret, preserving its line breaks.'
            exit 1
          fi
          printf '%s\n' "$KNOWN" > "$HOME/.ssh/known_hosts"
          trap 'rm -f "$HOME/.ssh/aurelis_deploy" "$HOME/.ssh/known_hosts"' EXIT
          ssh -i "$HOME/.ssh/aurelis_deploy" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=10 -- "aurelisdeploy@$HOST" 'printf "Connected as: "; whoami; printf "Host: "; hostname; printf "Home: "; pwd; printf "\nMEMORY\n"; free -m; printf "\nSWAP\n"; cat /proc/swaps; printf "\nOOM COUNTERS\n"; for f in /sys/fs/cgroup/memory.events /sys/fs/cgroup/memory.events.local; do if test -r "$f"; then echo "$f"; cat "$f"; fi; done; printf "\nLOAD\n"; uptime; printf "\nTOP MEMORY PROCESSES\n"; ps -eo pid,comm,rss,%mem --sort=-rss | head -12'
