name: AURELIS VPS connection check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  connection-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify required secrets exist
        env:
          HOST: ${{ secrets.VPS_HOST }}
          KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          test -n "$HOST" || { echo 'VPS_HOST secret missing'; exit 1; }
          test -n "$KEY" || { echo 'VPS_SSH_KEY secret missing'; exit 1; }
          test -n "$KNOWN" || { echo 'VPS_KNOWN_HOSTS secret missing'; exit 1; }
      - name: Connect and inspect (read only)
        env:
          HOST: ${{ secrets.VPS_HOST }}
          KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          umask 077
          mkdir -p "$HOME/.ssh"
          # Normalize secrets copied with literal backslash-n sequences.
          key_normalized="${KEY//\\n/
          printf '%s\n' "$KNOWN" > "$HOME/.ssh/known_hosts"
          trap 'rm -f "$HOME/.ssh/aurelis_deploy" "$HOME/.ssh/known_hosts"' EXIT
          ssh -i "$HOME/.ssh/aurelis_deploy" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=10 -- "aurelisdeploy@$HOST" 'printf "Connected as: "; whoami; printf "Host: "; hostname; printf "Home: "; pwd'
\n'}"
          printf '%s\n' "$key_normalized" > "$HOME/.ssh/aurelis_deploy"
          unset key_normalized KEY
          if ! ssh-keygen -y -P '' -f "$HOME/.ssh/aurelis_deploy" > /dev/null 2>&1; then
            echo 'VPS_SSH_KEY is not a valid unencrypted OpenSSH private key. Re-enter the entire multiline private key in GitHub Actions secrets.'
            exit 1
          fi
          printf '%s\n' "$KNOWN" > "$HOME/.ssh/known_hosts"
          trap 'rm -f "$HOME/.ssh/aurelis_deploy" "$HOME/.ssh/known_hosts"' EXIT
          ssh -i "$HOME/.ssh/aurelis_deploy" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=10 -- "aurelisdeploy@$HOST" 'printf "Connected as: "; whoami; printf "Host: "; hostname; printf "Home: "; pwd'
