name: AURELIS staging preflight
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  staging-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Verify staging source exists
        run: |
          test -f arbitrage/Cargo.toml || { echo 'Staging blocked: source not imported'; exit 1; }
          test -f arbitrage/Cargo.lock || { echo 'Staging blocked: lockfile missing'; exit 1; }
      - name: Check remote staging directory access (no changes)
        env:
          HOST: ${{ secrets.VPS_HOST }}
          KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -eu
          umask 077
          mkdir -p "$HOME/.ssh"
          trap 'rm -f "$HOME/.ssh/aurelis_deploy" "$HOME/.ssh/known_hosts"' EXIT
          python3 -c 'import os,pathlib; pathlib.Path.home().joinpath(".ssh/aurelis_deploy").write_text(os.environ["KEY"].replace(chr(92)+"n",chr(10)).rstrip()+chr(10))'
          ssh-keygen -y -P '' -f "$HOME/.ssh/aurelis_deploy" >/dev/null
          printf '%s\n' "$KNOWN" > "$HOME/.ssh/known_hosts"
          ssh -i "$HOME/.ssh/aurelis_deploy" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=10 -- "aurelisdeploy@$HOST" 'whoami; test -d /opt/aurelis-staging && test -w /opt/aurelis-staging && echo STAGING_READY'
