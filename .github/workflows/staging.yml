name: AURELIS Python staging deployment

on:
  workflow_run:
    workflows: ["AURELIS Python CI"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aurelis-python-staging
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - name: Validate paper source and isolated tests
        run: |
          set -eu
          test -f arbitrage/app.py
          test -f arbitrage/test_paper_calculations.py
          python3 -m unittest discover -s arbitrage -p 'test_*.py' -v
          python3 - <<'PY'
          import ast
          from pathlib import Path
          for path in Path('arbitrage').glob('*.py'):
              ast.parse(path.read_text(), filename=str(path))
          PY
      - name: Bundle source only, no runtime files or credentials
        run: |
          set -eu
          tar -czf "$RUNNER_TEMP/aurelis-paper-staging.tgz" arbitrage/*.py
          tar -tzf "$RUNNER_TEMP/aurelis-paper-staging.tgz"
      - name: Deploy isolated release to restricted VPS user
        env:
          HOST: ${{ secrets.VPS_HOST }}
          KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN: ${{ secrets.VPS_KNOWN_HOSTS }}
          RELEASE: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -eu
          test -n "$HOST" && test -n "$KEY" && test -n "$KNOWN"
          umask 077
          mkdir -p "$HOME/.ssh"
          trap 'rm -f "$HOME/.ssh/aurelis_deploy" "$HOME/.ssh/known_hosts"' EXIT
          python3 -c 'import os,pathlib; pathlib.Path.home().joinpath(".ssh/aurelis_deploy").write_text(os.environ["KEY"].replace(chr(92)+"n",chr(10)).rstrip()+chr(10))'
          unset KEY
          ssh-keygen -y -P '' -f "$HOME/.ssh/aurelis_deploy" >/dev/null
          printf '%s\n' "$KNOWN" > "$HOME/.ssh/known_hosts"
          case "$RELEASE" in *[!0-9a-f]*|'') echo "Invalid release SHA"; exit 1;; esac
          SSH="ssh -i $HOME/.ssh/aurelis_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=10"
          # Only user-owned staging directory. Never touch /opt/aurelis.
          $SSH "aurelisdeploy@$HOST" "set -eu; umask 077; mkdir -p 'aurelis-staging/releases/$RELEASE'"
          cat "$RUNNER_TEMP/aurelis-paper-staging.tgz" | $SSH "aurelisdeploy@$HOST" "set -eu; tar -xzf - -C 'aurelis-staging/releases/$RELEASE'"
          $SSH "aurelisdeploy@$HOST" bash -se -- "$RELEASE" <<'REMOTE'
          set -eu
          release="$1"
          root="$HOME/aurelis-staging"
          (cd "$root/releases/$release" && python3 -m unittest discover -s arbitrage -p 'test_*.py' -v)
          ln -sfn "releases/$release" "$root/current.next"
          mv -Tf "$root/current.next" "$root/current"
          # Restart only the service owned by the restricted deploy account.
          if test -f "$root/staging-api.pid"; then
            previous="$(cat "$root/staging-api.pid")"
            case "$previous" in *[!0-9]*|'') previous=0;; esac
            if test "$previous" -gt 1 && test -r "/proc/$previous/cmdline" && tr '\\0' ' ' < "/proc/$previous/cmdline" | grep -Fq 'arbitrage/staging_api.py'; then
              kill "$previous" || true
            fi
          fi
          mkdir -p "$root/logs"
          nohup python3 "$root/current/arbitrage/staging_api.py" --port 8895 </dev/null >"$root/logs/staging-api.log" 2>&1 &
          echo "$!" > "$root/staging-api.pid"
          python3 - <<'PY'
          import json
          import time
          from urllib.request import urlopen
          base = "http://127.0.0.1:8895"
          for _ in range(30):
              try:
                  with urlopen(base + "/health", timeout=2) as response:
                      health = json.load(response)
                  break
              except Exception:
                  time.sleep(0.5)
          else:
              raise SystemExit("Staging health check timed out")
          assert health["ok"] and health["paperMode"] and not health["liveTradingEnabled"]
          assert health["dataSource"] == "synthetic"
          for endpoint in ("/scan?target=25", "/dex-scan?target=25", "/status", "/treasury"):
              with urlopen(base + endpoint, timeout=3) as response:
                  data = json.load(response)
              assert data.get("mode") == "paper"
              if endpoint.startswith(("/scan", "/dex-scan")):
                  assert data["dataSource"] == "synthetic" and data["opportunities"] == []
              print("PASS", endpoint)
          with urlopen(base + "/public-markets?asset=BTC", timeout=20) as response:
              market = json.load(response)
          assert market["mode"] == "paper" and market["dataSource"] == "public_read_only"
          assert not market["executionReady"] and set(market["quotes"]) == {"hyperliquid", "dydx"}
          print("PASS /public-markets?asset=BTC", {k: "ok" if v.get("bid") and v.get("ask") else "unavailable" for k, v in market["quotes"].items()})
          with urlopen(base + "/markets", timeout=20) as response:
              catalog = json.load(response)
          assert catalog["mode"] == "paper" and not catalog["executionReady"]
          assert "overlapCount" in catalog and "assetCount" in catalog
          print("MARKET_DISCOVERY", "assets", catalog["assetCount"], "overlap", catalog["overlapCount"],
                "venues", {k: len(v["assets"]) for k, v in catalog["venues"].items()})
          for bot in ("hunter", "trade_radar", "signal_desk", "live_bet", "arbitrage", "grid", "dca"):
              with urlopen(base + "/agent-wallet?bot=" + bot, timeout=3) as response:
                  wallet = json.load(response)
              assert not wallet["authenticated"] and not wallet["executionReady"]
              assert not wallet["permissions"]["sign"] and not wallet["permissions"]["transfer"]
              print("PASS agent wallet:", bot)
          for provider in ("onekey", "safe", "offline"):
              with urlopen(base + "/agent-wallet?bot=arbitrage&provider=" + provider, timeout=3) as response:
                  state = json.load(response)
              assert state["provider"] == provider
              assert not state["executionReady"] and not state["permissions"]["sign"]
              assert not state["permissions"]["transfer"]
              print("PASS wallet provider:", provider)
          for bot in ("hunter", "trade_radar", "signal_desk", "live_bet", "arbitrage", "grid", "dca"):
              with urlopen(base + "/paper-prepare?bot=" + bot + "&venue=hyperliquid&asset=BTC&side=long&notional=25", timeout=3) as response:
                  proposal = json.load(response)
              assert proposal["bot"] == bot and proposal["type"] == "review_only"
              assert not proposal["executionReady"] and not proposal["orderSubmitted"]
              assert not proposal["signingAllowed"] and not proposal["transferAllowed"]
              print("PASS paper prepare:", bot)
          print("STAGING_API_READY: shared paper proposals; pluggable wallet interface; public discovery")
          PY
          REMOTE
