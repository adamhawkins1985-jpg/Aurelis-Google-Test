name: AURELIS VPS Service Diagnostics
on:
  push:
    paths:
      - '.github/workflows/vps-service-diagnostics.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 6
    steps:
      - name: Inspect backend service without changing it
        env:
          HOST: ${{ secrets.AURELIS_DEPLOY_HOST }}
          USER: ${{ secrets.AURELIS_DEPLOY_USER }}
          KEY: ${{ secrets.AURELIS_DEPLOY_KEY }}
          HOST_KEY: ${{ secrets.AURELIS_DEPLOY_HOST_KEY }}
        run: |
          set -euo pipefail
          for v in HOST USER KEY HOST_KEY; do test -n "${!v}" || { echo "Missing deployment secret: $v"; exit 1; }; done
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$HOST_KEY" > ~/.ssh/known_hosts
          printf '%s\n' "$KEY" > ~/.ssh/aurelis_deploy
          chmod 600 ~/.ssh/known_hosts ~/.ssh/aurelis_deploy
          ssh -i ~/.ssh/aurelis_deploy -o BatchMode=yes -o StrictHostKeyChecking=yes "$USER@$HOST" 'bash -se' <<'REMOTE'
          set -eu
          echo "=== runtime ==="
          test -s /home/ubuntu/aurelis-vnext/server.js && echo "backend file: present" || echo "backend file: missing"
          test -e /home/ubuntu/aurelis-vnext/.backend-rollback.js && echo "rollback marker: present" || echo "rollback marker: absent"
          echo "=== known services ==="
          for name in aurelis-vnext.service aurelis-website.service aurelis-web.service; do
            printf '%s: ' "$name"; systemctl is-active "$name" 2>/dev/null || true
          done
          echo "=== running node services (command lines hidden) ==="
          pgrep -c -f '[n]ode' || true
          echo "=== local application health ==="
          for port in 3000 3001 8080; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 3 "http://127.0.0.1:$port/api/health" || true)
            echo "$port: HTTP $code"
          done
          echo "=== configured authentication variable names only ==="
          cd /home/ubuntu/aurelis-vnext
          for file in .env .env.runtime-secrets; do
            if test -f "$file"; then
              awk -F= '/^[A-Za-z_][A-Za-z0-9_]*=/ {print $1}' "$file" | grep -Ei 'ORIGIN|TERMINAL|GATEWAY|BOT.*TOKEN|KRAKEN' | sort -u || true
            fi
          done
          echo "=== active Node service environment variable names only ==="
          systemctl show aurelis-vnext.service -p Environment --value | tr ' ' '\n' | sed -nE 's/^([A-Za-z_][A-Za-z0-9_]*)=.*/\1/p' | grep -Ei 'ORIGIN|TERMINAL|GATEWAY|KRAKEN' || true
          echo "=== Node backend service inventory ==="
          for unit in aurelis-vnext.service aurelis-website.service aurelis-web.service; do
            echo "UNIT: $unit"
            systemctl show "$unit" -p LoadState -p ActiveState -p WorkingDirectory -p ExecStart --no-pager 2>/dev/null | sed -E 's/(token|secret|key)=[^ ;]+/\\1=[REDACTED]/Ig' || true
          done
          echo "=== backend directory files ==="
          find /home/ubuntu/aurelis-vnext -maxdepth 1 -type f -printf '%f\n' | grep -E '^(server|package|\.env)' | sed '/env/d' | head -12
          echo "=== aurelis-web service metadata ==="
          systemctl show aurelis-web.service -p LoadState -p ActiveState -p SubState -p Result -p ExecMainStatus -p WorkingDirectory -p FragmentPath --no-pager || true
          echo "=== recent service log metadata (redacted) ==="
          journalctl -u aurelis-web.service --no-pager -n 60 -o cat 2>/dev/null | sed -E 's/(API[_-]?KEY|TOKEN|SECRET|PASSWORD|Authorization)([=: ]+)[^ ]+/\\1\\2[REDACTED]/Ig' | tail -60 || true
          echo "=== service unit names matching AURELIS (no secrets) ==="
          systemctl list-units --all --type=service --no-pager --no-legend | awk 'tolower($1) ~ /aurelis|node|wallet/ {print $1,$3,$4}' | head -25
          REMOTE
