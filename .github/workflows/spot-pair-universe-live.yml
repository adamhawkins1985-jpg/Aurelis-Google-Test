name: Spot Pair Universe Live Read Only
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/spot-pair-universe-live.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: cd website && npm ci --ignore-scripts
      - name: Probe Ethereum spot pair universe
        run: cd website && npx tsx scripts/probe_spot_pair_universe.ts
