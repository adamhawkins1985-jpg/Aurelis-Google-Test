name: CoW spot API read-only evaluation
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/cow-spot-api-evaluation.yml'
permissions:
  contents: read
jobs:
  verify-public-api:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Probe public CoW endpoints without signatures or orders
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const registry=fs.readFileSync('website/src/services/dexVenueRegistry.ts','utf8');
          if(!registry.includes("id: 'cow'") || !registry.includes("lifecycle: 'candidate'"))throw Error('CoW must be candidate only');
          const networks=['mainnet','base','arbitrum_one'];
          for(const network of networks){
            const url='https://api.cow.fi/'+network+'/api/v1/version';
            const response=await fetch(url,{signal:AbortSignal.timeout(12000),headers:{Accept:'application/json'}});
            console.log(network,'public API HTTP',response.status);
            if(!response.ok)throw Error(network+' unavailable');
            const version=(await response.text()).trim();
            if(!version || version.length>256)throw Error(network+' invalid API version');
            console.log(network,'version endpoint responsive');
          }
          console.log('CoW public APIs responsive. No quote, signing, orders or transfers performed.');
          console.log('US access and trading eligibility NOT established by API connectivity.');
          NODE
      - name: Request and validate unsigned indicative CoW spot quote
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const src=fs.readFileSync('website/src/services/walletConnectService.ts','utf8');
          const owner=src.match(/const BOT_AGENT_ADDRESS = '(0x[a-fA-F0-9]{40})'/)?.[1];
          if(!owner)throw Error('Bot wallet guard unavailable');
          const sellToken='0xC02aaA39b223FE8D0A0e5C4F27eAD9083C756Cc2';
          const buyToken='0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48';
          const sellAmountBeforeFee='10000000000000000';
          const response=await fetch('https://api.cow.fi/mainnet/api/v1/quote',{
            method:'POST',signal:AbortSignal.timeout(25000),
            headers:{'Content-Type':'application/json','Accept':'application/json'},
            body:JSON.stringify({sellToken,buyToken,sellAmountBeforeFee,kind:'sell',from:owner,priceQuality:'fast'})
          });
          console.log('CoW indicative quote HTTP',response.status);
          const data=await response.json().catch(()=>null);
          if(!response.ok){
            console.log('CoW quote refusal category:',typeof data?.errorType==='string'?data.errorType:'unspecified');
            throw Error('CoW indicative quote unavailable: HTTP '+response.status);
          }
          const quote=data?.quote;
          const positive=(s)=>typeof s==='string' && /^[0-9]+$/.test(s) && BigInt(s)>0n;
          const nonnegative=(s)=>typeof s==='string' && /^[0-9]+$/.test(s) && BigInt(s)>=0n;
          if(!quote || String(quote.sellToken).toLowerCase()!==sellToken.toLowerCase()
            || String(quote.buyToken).toLowerCase()!==buyToken.toLowerCase()
            || !positive(quote.buyAmount) || !positive(quote.sellAmount) || !nonnegative(quote.feeAmount))
            throw Error('CoW indicative quote fields invalid');
          console.log('CoW indicative quote passed identity and positive amount checks');
          console.log('Quote amount is NOT net profit: gas, fees, slippage, other venue costs and execution uncertainty remain.');
          console.log('No signatures, orders, approvals, funding or trading performed.');
          NODE
