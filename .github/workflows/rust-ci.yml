name: AURELIS Rust CI
on:
  push:
    paths:
      - 'arbitrage/**/*.rs'
      - 'arbitrage/**/Cargo.toml'
      - 'arbitrage/Cargo.lock'
      - '.github/workflows/rust-ci.yml'
  pull_request:
    paths:
      - 'arbitrage/**/*.rs'
      - 'arbitrage/**/Cargo.toml'
      - 'arbitrage/Cargo.lock'
      - '.github/workflows/rust-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Report Python-only checkout
        if: hashFiles('arbitrage/Cargo.toml') == ''
        run: echo 'No Rust Cargo.toml present; Rust tests not applicable.'
      - name: Install stable Rust
        if: hashFiles('arbitrage/Cargo.toml') != ''
        uses: dtolnay/rust-toolchain@stable
      - name: Build and test with constrained resources
        if: hashFiles('arbitrage/Cargo.toml') != ''
        working-directory: arbitrage
        env:
          CARGO_BUILD_JOBS: '2'
          CARGO_INCREMENTAL: '0'
          CARGO_PROFILE_TEST_DEBUG: '0'
        run: cargo test --workspace --locked -- --test-threads=2
