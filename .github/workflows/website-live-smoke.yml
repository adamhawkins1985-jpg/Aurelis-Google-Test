name: AURELIS production read-only smoke
# Verify live read-only endpoints after Kraken/Hunter protection review fix.
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/website-live-smoke.yml'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Verify public site and owner-only bot endpoints
        run: |
          set -euo pipefail
          BASE="https://wallet.ahconceptsai.com"
          curl -fsS --retry 3 --retry-delay 2 --max-time 20 "$BASE/api/health" > "$RUNNER_TEMP/health.json"
          node -e "const f=require('fs');const h=JSON.parse(f.readFileSync(process.argv[1],'utf8'));if(h.status!=='ok')process.exit(1);console.log('Public website health: ok')" "$RUNNER_TEMP/health.json"
          curl -fsS --retry 2 --max-time 20 "$BASE/" > "$RUNNER_TEMP/index.html"
          grep -Eq 'assets/index-[A-Za-z0-9_-]+\.js' "$RUNNER_TEMP/index.html"
          echo "Website HTML and application bundle: available"
          for route in             /api/bots/exchange-accounts             /api/bots/open-orders             /api/bots/kraken-execution-capability             /api/bots/kraken-test-readiness; do
            code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 16 "$BASE$route")"
            if test "$code" != 401; then
              echo "::error::Protected route had unexpected anonymous status $code ($route)"
              exit 1
            fi
            echo "Protected Bot API rejected unsigned access: $route"
          done
          # This request cannot place an order: no signed owner, no confirmation token,
          # and the endpoint is Kraken validation-only.
          validation_http="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 \
            -X POST -H 'Content-Type: application/json' -d '{}' \
            "$BASE/api/signal-desk/order/validate")"
          test "$validation_http" = "401" || {
            echo "::error::No-trade validation must require signed Bot Wallet owner; HTTP $validation_http"
            exit 1
          }
          # No order token is supplied. Unsigned submit MUST fail before any broker request.
          submit_http="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 \
            -X POST -H 'Content-Type: application/json' -d '{}' \
            "$BASE/api/signal-desk/order/submit")"
          test "$submit_http" = "401" || {
            echo "::error::Real trade submission unexpectedly accepted unsigned access: HTTP $submit_http"
            exit 1
          }
          echo "Kraken submit endpoint rejects unsigned requests: yes"
          echo "Kraken validate-only endpoint requires signed owner: yes"
          echo "PASS: site health, website bundle, authenticated bot APIs and no-trade validation access control."
