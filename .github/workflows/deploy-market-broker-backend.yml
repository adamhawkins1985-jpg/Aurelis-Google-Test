name: Deploy AURELIS Market Broker backend

# Deliberately manual only. Backend code handles exchange integrations;
# an unrelated Codex or feature-branch push must never restart production.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aurelis-market-broker-backend-production
  cancel-in-progress: false

jobs:
  deploy:
    # A manual dispatch against a feature branch must not deploy it.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - name: Check deployment access is configured
        env:
          HOST: ${{ secrets.AURELIS_DEPLOY_HOST }}
          USER: ${{ secrets.AURELIS_DEPLOY_USER }}
          KEY: ${{ secrets.AURELIS_DEPLOY_KEY }}
          HOST_KEY: ${{ secrets.AURELIS_DEPLOY_HOST_KEY }}
        run: |
          for x in HOST USER KEY HOST_KEY; do
            if [ -z "${!x}" ]; then echo "::error::Missing $x"; exit 1; fi
          done
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Check broker logic and compile backend
        working-directory: website
        run: |
          npm ci --legacy-peer-deps
          npx tsx scripts/test_market_broker_coach.ts
          npm run build
          test -s server.js
      - name: Set up pinned SSH identity
        env:
          KEY: ${{ secrets.AURELIS_DEPLOY_KEY }}
          HOST_KEY: ${{ secrets.AURELIS_DEPLOY_HOST_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$HOST_KEY" > ~/.ssh/known_hosts
          printf '%s\n' "$KEY" > ~/.ssh/aurelis_deploy
          chmod 600 ~/.ssh/known_hosts ~/.ssh/aurelis_deploy
      - name: Verify backend service and upload staged file
        env:
          HOST: ${{ secrets.AURELIS_DEPLOY_HOST }}
          USER: ${{ secrets.AURELIS_DEPLOY_USER }}
        run: |
          SSH="ssh -i $HOME/.ssh/aurelis_deploy -o StrictHostKeyChecking=yes -o BatchMode=yes"
          $SSH "$USER@$HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          cd /home/ubuntu/aurelis-vnext
          test -s server.js || { echo "Expected live backend missing; refusing overwrite"; exit 1; }
          test ! -e .backend-rollback.js || { echo "Previous rollback present; refusing overwrite"; exit 1; }
          service=""
          for candidate in aurelis-vnext.service aurelis-website.service aurelis-web.service; do
            if systemctl is-active --quiet "$candidate"; then service="$candidate"; break; fi
          done
          test -n "$service" || { echo "No recognized active backend systemd service; refusing unsafe deploy"; exit 1; }
          workdir="$(systemctl show "$service" -p WorkingDirectory --value)"
          test "$workdir" = "/home/ubuntu/aurelis-vnext" || { echo "Service directory doesn't match deployed backend; refusing"; exit 1; }
          printf '%s\n' "$service" > .backend-deploy-service
          REMOTE
          scp -i "$HOME/.ssh/aurelis_deploy" -o StrictHostKeyChecking=yes -o BatchMode=yes website/server.js "$USER@$HOST:/home/ubuntu/aurelis-vnext/.backend-staged.js"
      - name: Atomically deploy backend with automatic rollback
        env:
          HOST: ${{ secrets.AURELIS_DEPLOY_HOST }}
          USER: ${{ secrets.AURELIS_DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/aurelis_deploy -o StrictHostKeyChecking=yes -o BatchMode=yes "$USER@$HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          cd /home/ubuntu/aurelis-vnext
          service="$(cat .backend-deploy-service)"
          case "$service" in aurelis-vnext.service|aurelis-website.service|aurelis-web.service) ;; *) exit 1;; esac
          test -s .backend-staged.js
          cp -p server.js .backend-rollback.js
          mv .backend-staged.js server.js
          restart_failed=0
          sudo -n systemctl restart "$service" || restart_failed=1
          health=1
          if [ "$restart_failed" -eq 0 ]; then
            for i in 1 2 3 4 5; do
              if curl -fsS --max-time 5 http://127.0.0.1:3000/api/health >/dev/null; then health=0; break; fi
              sleep 3
            done
          fi
          if [ "$health" -ne 0 ]; then
            echo "Backend health failed; rolling back"
            mv .backend-rollback.js server.js
            sudo -n systemctl restart "$service" || true
            exit 1
          fi
          rm .backend-rollback.js .backend-deploy-service
          echo "Backend deployed and local health verified"
          REMOTE
