name: AURELIS production release gate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release-gate:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Enforce manual release prerequisites
        run: |
          test -f arbitrage/Cargo.toml || { echo 'Production blocked: source missing'; exit 1; }
          test -f arbitrage/Cargo.lock || { echo 'Production blocked: lockfile missing'; exit 1; }
          echo 'Production release gate is in audit-only mode.'
          echo 'No upload, service restart, orders, or wallet operations are configured.'
