name: Live Spot Round Trip Read Only
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/spot-round-trip-live.yml'
      - 'website/src/services/spotRoundTripReadOnly.ts'
      - 'website/scripts/probe_live_spot_round_trip.ts'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: cd website && npm ci --ignore-scripts
      - name: Check retired spot probe applicability
        id: applicability
        run: |
          if test -f website/src/services/spotRoundTripReadOnly.ts; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::This retired research module is absent from the deployed AURELIS website; test not applicable."
          fi
      - name: Read only live two-leg quote probe
        if: steps.applicability.outputs.present == 'true'
        run: cd website && npx tsx scripts/probe_live_spot_round_trip.ts
      - name: Check current bot manual-execution safety instead
        if: steps.applicability.outputs.present == 'false'
        run: cd website && node scripts/test_kraken_manual_cap.mjs
