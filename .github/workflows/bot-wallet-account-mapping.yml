name: AURELIS Bot wallet public account mapping
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/bot-wallet-account-mapping.yml'
permissions:
  contents: read
jobs:
  observe-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Diagnose Lighter upstream discovery without secrets
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const source=fs.readFileSync('website/src/services/walletConnectService.ts','utf8');
          const wallet=source.match(/const BOT_AGENT_ADDRESS = '(0x[a-fA-F0-9]{40})'/)?.[1];
          if(!wallet) throw Error('Bot public wallet identity unavailable');
          const url='https://mainnet.zklighter.elliot.ai/api/v1/accountsByL1Address?'+new URLSearchParams({l1_address:wallet});
          try {
            const response=await fetch(url,{headers:{Accept:'application/json'},signal:AbortSignal.timeout(12000)});
            console.log('Lighter upstream HTTP:',response.status);
            const body=await response.json().catch(()=>null);
            console.log('Lighter upstream response code:',typeof body?.code==='number'?body.code:'unknown');
            console.log('Lighter upstream has account list:',Array.isArray(body?.sub_accounts));
            console.log('Lighter upstream count:',Array.isArray(body?.sub_accounts)?body.sub_accounts.length:'unknown');
            console.log('Lighter upstream pagination:',Boolean(body?.next_cursor));
            console.log('Lighter upstream L1 address matches:',typeof body?.l1_address==='string'&&body.l1_address.toLowerCase()===wallet.toLowerCase());
            console.log('Lighter upstream error category:',typeof body?.error==='string'?'error returned':'none');
          } catch(e) { console.log('Lighter upstream request failed:',e?.name||'network error'); }
          NODE
      - name: Verify live public endpoint identity without wallet keys
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const source=fs.readFileSync('website/src/services/walletConnectService.ts','utf8');
          const match=source.match(/const BOT_AGENT_ADDRESS = '(0x[a-fA-F0-9]{40})'/);
          if(!match) throw Error('Bot address missing from wallet session guard');
          const wallet=match[1].toLowerCase();
          if(/^0x0{40}$/.test(wallet)) throw Error('Placeholder wallet');
          const base='https://wallet.ahconceptsai.com/api/bots/';
          async function check(path){
            const url=base+path+'?'+new URLSearchParams({wallet});
            const res=await fetch(url,{signal:AbortSignal.timeout(24000),headers:{Accept:'application/json'}});
            if(!res.ok){
              let reason='';
              try { const failure=await res.json(); reason=typeof failure?.error==='string'?failure.error:''; } catch {}
              throw Error(path+' HTTP '+res.status+(reason?' '+reason:''));
            }
            const payload=await res.json();
            if(!payload || typeof payload!=='object')throw Error(path+' invalid JSON');
            const reported=path==='hyperliquid-account'?payload.walletAddress:payload.wallet;
            if(typeof reported!=='string' || reported.toLowerCase()!==wallet)throw Error(path+' wallet mismatch');
            return payload;
          }
          const hyper=await check('hyperliquid-account');
          console.log('Hyperliquid public account address match: confirmed (ownership unverified).');
          let discovery;
          try {
            discovery=await check('lighter-accounts');
            if(discovery.ok!==true || discovery.complete!==true || !Array.isArray(discovery.accountIndices)
              || discovery.accountIndices.length>20 || new Set(discovery.accountIndices).size!==discovery.accountIndices.length
              || !discovery.accountIndices.every(v=>Number.isSafeInteger(v)&&v>=0)) throw Error('invalid account indices');
            console.log('Lighter account discovery: valid; account count:',discovery.accountIndices.length);
          } catch(e) {
            console.error('Lighter discovery failed before snapshot:',e.message);
            throw e;
          }
          let lighter;
          try { lighter=await check('lighter-snapshot'); }
          catch(e) {
            console.error('Lighter discovery succeeded, but balance/position snapshot failed:',e.message);
            throw e;
          }
          if(lighter.ok!==true || lighter.complete!==true || !Array.isArray(lighter.accounts) || lighter.accounts.length>20)throw Error('Lighter incomplete snapshot');
          const ids=new Set();
          for(const account of lighter.accounts){
            if(!Number.isSafeInteger(account.accountIndex)||account.accountIndex<0||ids.has(account.accountIndex))throw Error('Lighter invalid account index');
            ids.add(account.accountIndex);
          }
          if(!('perpsAccountValueUsd' in hyper) || !('openPerpPositions' in hyper))throw Error('Hyperliquid aggregate missing');
          console.log('Read-only Bot address association confirmed against Hyperliquid and Lighter public endpoints.');
          console.log('Lighter discovered account count:',ids.size);
          console.log('WalletConnect session control/cryptographic ownership NOT proven by public API checks.');
          console.log('No keys, sign requests, trades, or transfers used.');
          NODE
