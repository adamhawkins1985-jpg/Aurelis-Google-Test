name: AURELIS spot paper status snapshot
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/aurelis-spot-status.yml'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - name: Configure SSH
        env:
          KEY: ${{ secrets.AURELIS_DEPLOY_KEY }}
          HOSTKEY: ${{ secrets.AURELIS_DEPLOY_HOST_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$HOSTKEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Refresh public-safe paper bot status
        env:
          HOST: ${{ secrets.AURELIS_DEPLOY_HOST }}
          USER: ${{ secrets.AURELIS_DEPLOY_USER }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -i ~/.ssh/id_ed25519 "$USER@$HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          c=aurelis-freqtrade-aggressive
          root=$(docker inspect --format '{{range .Mounts}}{{if eq .Destination "/freqtrade/user_data"}}{{.Source}}{{end}}{{end}}' "$c")
          test -n "$root" && test -d "$root"
          ROOT="$root" python3 - <<'PY'
          import os,sqlite3,glob,json,datetime
          root=os.environ['ROOT']
          cfg=json.load(open(os.path.join(root,'config.json')))
          if cfg.get('dry_run') is not True or cfg.get('trading_mode')!='spot':
              raise SystemExit('Refusing to publish non-paper status')
          dbpath=os.path.join(root,'trades.dryrun.sqlite')
          db=sqlite3.connect('file:'+dbpath+'?mode=ro',uri=True,timeout=3)
          db.row_factory=sqlite3.Row
          rows=db.execute('select id,pair,amount,open_rate,realized_profit,close_profit_abs,is_open from trades order by id desc limit 10000').fetchall()
          positions=[{'pair':r['pair'],'amount':round(r['amount'] or 0,8),'entry':round(r['open_rate'] or 0,8)} for r in rows if r['is_open']][:10]
          closed=[r for r in rows if not r['is_open'] and r['close_profit_abs'] is not None]
          profit=sum(float(r['close_profit_abs']) for r in closed)
          wins=[r for r in closed if float(r['close_profit_abs'] or 0)>0]
          losses=[r for r in closed if float(r['close_profit_abs'] or 0)<0]
          gross_win=sum(float(r['close_profit_abs'] or 0) for r in wins)
          gross_loss=sum(float(r['close_profit_abs'] or 0) for r in losses)
          recent=[{'pair':r['pair'],'net':round(float(r['close_profit_abs'] or 0),2)} for r in closed[:8]]
          status={'asOf':datetime.datetime.now(datetime.timezone.utc).isoformat(),'mode':'paper','bot':'Aggressive Spot','positions':positions,'closedTrades':len(closed),'profitBasis':'Recorded closed-trade P&L (verify fee inclusion against exchange and Freqtrade records)','closedNetProfit':round(profit,2),'wins':len(wins),'losses':len(losses),'winRate':round(len(wins)/len(closed)*100,1) if closed else None,'grossWin':round(gross_win,2),'grossLoss':round(gross_loss,2),'recentTrades':recent,'liveTradingEnabled':False,'entryTimeoutMinutes':(cfg.get('unfilledtimeout') or {}).get('entry')}
          target='/home/ubuntu/aurelis-ai-research/ai-research/spot-status.json'
          os.makedirs(os.path.dirname(target),exist_ok=True)
          tmp=target+'.tmp'
          with open(tmp,'w') as f: json.dump(status,f)
          os.replace(tmp,target)
          print('Paper status refreshed; open positions:',len(positions),'closed trades:',len(closed))
          PY
          REMOTE
