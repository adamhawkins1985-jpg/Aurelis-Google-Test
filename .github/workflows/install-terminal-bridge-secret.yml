name: Install Terminal Bridge Secret
on:
  push:
    paths:
      - '.github/workflows/install-terminal-bridge-secret.yml'
permissions:
  contents: read
jobs:
  install:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Decrypt and securely install matching VPS token
        env:
          HOST: ${{ secrets.AURELIS_DEPLOY_HOST }}
          USER: ${{ secrets.AURELIS_DEPLOY_USER }}
          KEY: ${{ secrets.AURELIS_DEPLOY_KEY }}
          HOST_KEY: ${{ secrets.AURELIS_DEPLOY_HOST_KEY }}
          ENCRYPTED: ''
        run: |
          set -euo pipefail
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$HOST_KEY" > ~/.ssh/known_hosts
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/*
          printf '%s' "$ENCRYPTED" | base64 -d > /tmp/terminal-bridge.enc
          scp -q -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes /tmp/terminal-bridge.enc "$USER@$HOST:/home/ubuntu/.local/share/aurelis/terminal-bridge.enc"
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes "$USER@$HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          umask 077
          dir=/home/ubuntu/.local/share/aurelis
          token=$(openssl pkeyutl -decrypt -inkey "$dir/terminal-bridge-private.pem" -in "$dir/terminal-bridge.enc" -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256)
          test "${#token}" -eq 64
          file=/home/ubuntu/aurelis-vnext/.env.runtime-secrets
          test -f "$file"
          python3 -c 'import sys,pathlib; p=pathlib.Path(sys.argv[1]); value=sys.argv[2]; data=p.read_text(); lines=[x for x in data.splitlines() if not x.startswith("AURELIS_TERMINAL_ORIGIN_TOKEN=")]; p.write_text("\n".join(lines)+("\n" if lines else "")+"AURELIS_TERMINAL_ORIGIN_TOKEN="+value+"\n");p.chmod(0o600)' "$file" "$token"
          rm -f "$dir/terminal-bridge.enc"
          sudo -n systemctl restart aurelis-vnext.service
          for i in 1 2 3 4 5; do
            if curl -fsS --max-time 3 http://127.0.0.1:3000/api/health >/dev/null; then echo "Node backend healthy, token installed"; exit 0; fi
            sleep 2
          done
          echo "Health failed after restart"
          exit 1
          REMOTE
