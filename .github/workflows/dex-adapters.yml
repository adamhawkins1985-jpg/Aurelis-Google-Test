name: DEX adapter safety
permissions:
  contents: read
on:
  push:
    branches: [main]
    paths:
      - 'website/src/services/spotRoundTripReadOnly.ts'
      - 'website/src/services/spotRoundTripScanner.ts'
      - 'website/src/services/spotPairUniverse.ts'
      - 'website/scripts/test_spot_round_trip.ts'
      - 'website/src/services/dexVenueRegistry.ts'
      - 'website/src/services/dexAccountAdapters.ts'
      - 'website/src/services/dexMonitoringReconciliation.ts'
      - 'website/src/services/botDexMonitoring.ts'
      - 'website/src/services/hyperliquidReadOnlyAdapter.ts'
      - 'website/src/services/lighterReadOnlyAdapter.ts'
      - 'website/src/services/lighterOrderNormalizer.ts'
      - 'website/src/services/lighterMonitoringState.ts'
      - 'website/server.ts'
      - 'website/server/lighter_active_order_read.ts'
      - 'website/server/bot_monitor_access.ts'
      - 'website/src/components/AiScreen.tsx'
      - 'website/scripts/test_dex_adapters.ts'
      - 'website/package.json'
      - '.github/workflows/dex-adapters.yml'
  pull_request:
    paths:
      - 'website/**'
      - '.github/workflows/dex-adapters.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: |
          npm ci --no-audit --no-fund
      - name: Check if legacy DEX adapter suite is applicable
        id: dex_applicability
        run: |
          if test -f src/services/dexVenueRegistry.ts && test -f src/services/spotRoundTripScanner.ts; then
            echo "legacy=true" >> "$GITHUB_OUTPUT"
          else
            echo "legacy=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Legacy DEX adapter modules were removed from the deployed website; legacy suite is not applicable."
          fi
      - name: Test legacy DEX registry and adapters (only when present)
        if: steps.dex_applicability.outputs.legacy == 'true'
        id: dex_tests
        run: npm run test:dex
      - name: Type check current website app/server
        run: npx tsc --noEmit -p tsconfig.app-ci.json
      - name: Verify current bot execution safety
        run: |
          node scripts/test_kraken_manual_cap.mjs
          npx tsx scripts/test_kraken_position_protection.ts
      - name: Build
        run: npm run build
      - name: Publish job summary
        if: always()
        run: |
          echo '### AURELIS DEX verification' >> "$GITHUB_STEP_SUMMARY"
          echo '- Commit: ${{ github.sha }}' >> "$GITHUB_STEP_SUMMARY"
          echo '- Legacy DEX adapter applicable: ${{ steps.dex_applicability.outputs.legacy }}'\n          echo '- Legacy DEX adapter test result: ${{ steps.dex_tests.outcome }}' >> "$GITHUB_STEP_SUMMARY"
          echo '- Trading/funding permissions: unchanged' >> "$GITHUB_STEP_SUMMARY"
