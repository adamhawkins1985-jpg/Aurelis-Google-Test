name: Import live website source (one time)
on:
  push:
    paths:
      - '.github/workflows/website-import.yml'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch vetted source from temporary VPS localhost bridge
        env:
          HOST: ${{ secrets.VPS_HOST }}
          KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -eu
          test -n "$HOST" && test -n "$KEY" && test -n "$KNOWN"
          umask 077
          mkdir -p "$HOME/.ssh"
          trap 'rm -f "$HOME/.ssh/aurelis_import" "$HOME/.ssh/known_hosts"' EXIT
          python3 -c 'import os,pathlib;pathlib.Path.home().joinpath(".ssh/aurelis_import").write_text(os.environ["KEY"].replace(chr(92)+"n",chr(10)).rstrip()+chr(10))'
          unset KEY
          printf '%s\n' "$KNOWN" > "$HOME/.ssh/known_hosts"
          ssh-keygen -y -P '' -f "$HOME/.ssh/aurelis_import" >/dev/null
          ssh -i "$HOME/.ssh/aurelis_import" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=10 "aurelisdeploy@$HOST" \
            "curl -fsS --max-time 30 http://127.0.0.1:18777/website-source-179c48b21520adf97823e95b9cdff270e2a80c80e0e65e28384a1a9bc2d8d888" > "$RUNNER_TEMP/site.tgz"
          echo '179c48b21520adf97823e95b9cdff270e2a80c80e0e65e28384a1a9bc2d8d888  '"$RUNNER_TEMP/site.tgz" | sha256sum -c -
          python3 - "$RUNNER_TEMP/site.tgz" <<'PY'
          import sys,tarfile
          with tarfile.open(sys.argv[1],"r:gz") as tf:
              members=tf.getmembers()
              assert members and all(m.isfile() and m.name.startswith("website/") and ".." not in m.name.split("/") for m in members)
              assert not any(m.name.split("/")[-1].startswith(".env") or "/node_modules/" in m.name or "/dist/" in m.name or "/backups/" in m.name for m in members)
              tf.extractall(".",filter="data")
          PY
      - name: Build imported website
        working-directory: website
        run: |
          npm ci --legacy-peer-deps
          npm run build
      - name: Commit source into private repository
        run: |
          set -eu
          git add website
          if git diff --cached --quiet; then
            echo 'Website source already imported'
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Import sanitized AURELIS website source"
          git push origin HEAD:main
