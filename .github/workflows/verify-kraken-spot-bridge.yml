name: Verify Kraken Spot Bridge
on:
  push:
    paths:
      - '.github/workflows/verify-kraken-spot-bridge.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Test private balance read without printing account values
        env:
          HOST: ${{ secrets.AURELIS_DEPLOY_HOST }}
          USER: ${{ secrets.AURELIS_DEPLOY_USER }}
          KEY: ${{ secrets.AURELIS_DEPLOY_KEY }}
          HOST_KEY: ${{ secrets.AURELIS_DEPLOY_HOST_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$HOST_KEY" > ~/.ssh/known_hosts
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/*
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes -o BatchMode=yes "$USER@$HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          cd /home/ubuntu/aurelis-vnext
          python3 - <<'PY'
          import pathlib,urllib.request,json,sys
          p=pathlib.Path('.env.runtime-secrets')
          token=next((s.split('=',1)[1] for s in p.read_text().splitlines() if s.startswith('AURELIS_TERMINAL_ORIGIN_TOKEN=')),None)
          if not token:
              print('ERROR: terminal token missing');sys.exit(1)
          request=urllib.request.Request('http://127.0.0.1:3000/api/terminal/kraken/spot-balances',headers={'Authorization':'Bearer '+token,'Accept':'application/json'})
          try:
              with urllib.request.urlopen(request,timeout=12) as response:
                  obj=json.load(response)
                  if obj.get('ok') is not True or not isinstance(obj.get('balances'),list):
                      print('ERROR: unexpected balance response');sys.exit(1)
                  print('RESULT: authenticated Kraken Spot response succeeded')
                  print('Balance asset rows:',len(obj['balances']))
          except Exception as e:
              if hasattr(e,'code'):print('ERROR: backend HTTP',e.code)
              else:print('ERROR: private account read unavailable')
              sys.exit(1)
          PY
          REMOTE
